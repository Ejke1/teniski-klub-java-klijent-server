# Podesavanje logovanja samo za JUnit testove.
# Testovi namerno izazivaju greske (pogresna konfiguracija, server koji ne radi,
# prekid veze...) da bi proverili da program na njih pravilno reaguje.
# Poruke o tim ocekivanim greskama se upisuju u fajl build/test/test-log.txt,
# a ne u Output, da ne bi izgledale kao greske u programu.
handlers=java.util.logging.FileHandler
.level=INFO
java.util.logging.FileHandler.pattern=build/test/test-log.txt
java.util.logging.FileHandler.append=false
java.util.logging.FileHandler.encoding=UTF-8
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter
